services:
  frontend:
    image: kskaman/example-frontend:latest
    ports:
      - "5001:5001"
    depends_on:
      - backend
  
  backend:
    image: kskaman/example-backend:latest
    ports:
      - "8080:8080"
    environment:
      REQUEST_ORIGIN: http://localhost:5001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: examplepassword
      POSTGRES_DATABASE: messages
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: examplepassword
      POSTGRES_DB: messages
    volumes:
      - ./database:/var/lib/postgresql
  