services:
  frontend:
    image: kskaman/example-frontend:latest
    depends_on:
      - backend
  
  backend:
    image: kskaman/example-backend:latest
    environment:
      REQUEST_ORIGIN: http://localhost:5001
      REDIS_HOST: redis
      REDIS_PORT: 6379
      POSTGRES_HOST: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: examplepassword
      POSTGRES_DATABASE: messages
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  redis:
    image: redis:latest

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: examplepassword
      POSTGRES_DB: messages
    volumes:
      - ./database:/var/lib/postgresql
  
  nginx:
    image: nginx:stable
    ports:
      - 8000:80
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    